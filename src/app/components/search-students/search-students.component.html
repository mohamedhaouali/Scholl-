<!-- CONTACT -->
<div id="contact" class="contact_area section-padding">
  <div class="container">			
    <div class="row">					
      <div class="col-lg-12 col-sm-12 col-xs-12 wow fadeInUp" data-wow-duration="1s" data-wow-delay="0.2s" data-wow-offset="0">		
        <div class="contact">
          <form [formGroup]="searchForm" (ngSubmit)="searchStudents()">
            <div class="form-group">
              <input type="number" formControlName="phone" class="form-control" placeholder="Insert phone student...">
            </div>
            
            <div *ngIf="searchForm.controls['phone'].invalid && (searchForm.controls['phone'].touched || searchForm.controls['phone'].dirty)" class="text-danger">
              <div *ngIf="searchForm.controls['phone'].errors?.['required']">Phone is required</div>
            </div>

            <div class="form-group">
              <button type="submit" [disabled]="searchForm.invalid" class="btn btn-primary py-3 px-5">Search</button>
            </div>

            <!--Display MSG-->
            <span class="text-danger">{{ errorMsg }}</span>

            <!--Display matches - Conteneur Flexbox global -->
            <div *ngFor="let m of studentsTab" class="student-profile-container" style="margin-top :100px">
              
              <!-- Partie Droite : Composant enfant affichant Note et Evaluation -->
              <div class="student-evaluation-block">
                <app-evaluations [obj]="m"></app-evaluations>
              </div>

            </div>
          </form>  
        </div>
      </div><!-- END COL  -->
    </div><!-- END ROW -->				
  </div><!--- END CONTAINER -->
</div>
<!-- END CONTACT -->
