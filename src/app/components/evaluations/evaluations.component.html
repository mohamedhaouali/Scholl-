<!-- START AGENT PROFILE -->
<section class="template_agent section-padding">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 col-sm-12 col-xs-12">
                <div class="single_agent">
                    <div class="single_agent_image">
                        <img src="assets/img/team/team1.jpg" class="img-fluid" alt="Student Profile"/>
                    </div>
                    <div class="single_agent_content">
                         <h4>Student: {{ obj?.studentId?.firstName }} {{ obj?.studentId?.lastName }}</h4>
                         <h4>Cours: {{ obj?.tId?.name }}</h4>
                        <h4 [ngStyle]="{ 'color': notesColor(obj?.note) }">Note: {{ obj?.note }}</h4>
                        <h4>Evaluation: {{ obj?.evaluation }}</h4>
                    </div>
                   

                    <!-- Option A : Supprimer complètement cette balise h3 si vous ne voulez pas de la mention en bas -->
                    <!-- Option B : Afficher uniquement la mention si elle est différente de l'évaluation -->
                    <h3 *ngIf="obj?.note < 14" [ngClass]="{ 'green': obj?.note > 10, 'red': obj?.note < 10, 'blue': obj?.note === 10 }">
                        {{ obj?.note >= 10 && obj?.note < 12 ? 'Passable' : '' }}
                    </h3> 
                    
                </div><!--- END SINGLE ITEM -->		
            </div><!--- END COL -->				  
        </div><!--- END ROW -->
    </div><!--- END CONTAINER -->		
</section>
<!-- END AGENT PROFILE -->
