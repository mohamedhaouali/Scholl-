		<!-- CONTACT -->
<div id="contact" class="contact_area section-padding">
    <div class="container">			
        <div class="row">					
            <div class="col-lg-12 col-sm-12 col-xs-12 wow fadeInUp" data-wow-duration="1s" data-wow-delay="0.2s" data-wow-offset="0">		
                <div class="contact">
                    <form #studentForm="ngForm" (ngSubmit)="editStudent()">
                        <div class="row">
                            <div class="form-group col-md-6">
                                <label for="">First Name</label>
                                <input type="text" [(ngModel)]="student.firstName" name="firstname" class="form-control" placeholder="First Name">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="">Last Name</label>
                                <input type="text" [(ngModel)]="student.lastName" name="lastName" class="form-control" placeholder="Last Name">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="">Email</label>
                                <input type="email" [(ngModel)]="student.email" name="email" class="form-control" placeholder="email">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="">Phone</label>
                                <input type="number" [(ngModel)]="student.phone" name="telephone" class="form-control" placeholder="telephone">
                            </div>

                            <!-- NOUVEAU : CHAMP PHOTO + APERÇU -->
                            <div class="form-group col-md-12 d-flex align-items-center gap-3" style="margin-bottom: 15px;">
                                <div style="flex: 1;">
                                    <label for="studentPhoto">Student Photo</label>
                                    <input type="file" id="studentPhoto" name="photo" class="form-control" accept="image/*" (change)="onPhotoSelected($event)">
                                </div>
                                <!-- Aperçu de la photo actuelle ou de la nouvelle image sélectionnée -->
                                <div *ngIf="student.photoUrl || photoPreview" style="margin-top: 25px; margin-left: 15px;">
                                    <img [src]="photoPreview || student.photoUrl" alt="Student Preview" class="img-thumbnail" style="max-height: 80px; width: 80px; object-fit: cover; border-radius: 50%;">
                                </div>
                            </div>

                            <div class="form-group col-md-12">
                                <label for="">Adress</label>
                                <textarea rows="6" [(ngModel)]="student.adress" name="adress" class="form-control" placeholder="Adresse"></textarea>
                            </div>
                            <div class="col-md-12 text-center">
                                <button type="submit" value="Send message" name="submit" id="submitButton" class="btn_one" title="Submit Your Message!">Edit Student</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div><!-- END COL  -->
        </div><!-- END ROW -->				
    </div><!--- END CONTAINER -->
</div>
<!-- END CONTACT -->
